# Knowledge Service en contenedor — con LibreOffice incluido, para no instalar
# dependencias de sistema en el host.
#
#   cd knowledge-service
#   docker compose up -d --build
#   docker compose down
#
# Usa la red del host (network_mode: host):
#   - el backend del host lo alcanza en http://localhost:8000 (KNOWLEDGE_SERVICE_URL);
#   - puede conectar a la DB local (knowledge-db en localhost:5434) si DATABASE_URL
#     apunta a ella (por defecto knowledge-service/.env apunta a Supabase).
#
# ⚠️ No levantes el knowledge-service del host a la vez. Si usás `node dev.js`,
#    pasale el flag --ks-docker para que no monte otro en :8000:
#      node dev.js --ks-docker
name: knowledge-service

services:
  knowledge-service:
    build: .
    container_name: knowledge-service
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
