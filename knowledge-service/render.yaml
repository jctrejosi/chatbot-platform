services:
  - type: web
    name: knowledge-service
    runtime: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu fonts-liberation && rm -rf /var/lib/apt/lists/*
      pip install --no-cache-dir -r requirements.txt
    startCommand: python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
